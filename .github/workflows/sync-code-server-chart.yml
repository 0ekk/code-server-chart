name: Sync code-server Helm chart

on:
  schedule:
    # GitHub cron is UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-code-server-chart
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: coder/code-server
  CHART_PATH: ci/helm-chart

jobs:
  sync:
    name: Sync latest upstream chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout chart repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find latest code-server tag
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(
            git ls-remote --tags --refs --sort=-v:refname \
              "https://github.com/${UPSTREAM_REPOSITORY}.git" "refs/tags/v*" |
              sed 's#.*refs/tags/##' |
              grep -Ev '(-rc|-alpha|-beta)' |
              head -n 1
          )"

          if [[ -z "${latest_tag}" ]]; then
            echo "No upstream release tag found." >&2
            exit 1
          fi

          chart_version="${latest_tag#v}"

          echo "tag=${latest_tag}" >> "${GITHUB_OUTPUT}"
          echo "chart_version=${chart_version}" >> "${GITHUB_OUTPUT}"
          echo "Latest upstream tag: ${latest_tag}"

      - name: Check whether matching release already exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Release ${TAG} already exists in ${GITHUB_REPOSITORY}."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "Release ${TAG} does not exist; continuing."
          fi

      - name: Prepare gh-pages branch
        id: gh_pages
        env:
          CHART_VERSION: ${{ steps.upstream.outputs.chart_version }}
        shell: bash
        run: |
          set -euo pipefail

          package_file="code-server-${CHART_VERSION}.tgz"
          echo "package_file=${package_file}" >> "${GITHUB_OUTPUT}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
            git worktree add gh-pages gh-pages
          else
            git worktree add --detach gh-pages
            git -C gh-pages switch --orphan gh-pages
            git -C gh-pages rm -rf . >/dev/null 2>&1 || true
          fi

          if [[ -f "gh-pages/${package_file}" ]] &&
             [[ -f gh-pages/index.yaml ]] &&
             grep -Fq "version: ${CHART_VERSION}" gh-pages/index.yaml &&
             grep -Fq "${package_file}" gh-pages/index.yaml; then
            echo "ok=true" >> "${GITHUB_OUTPUT}"
            echo "gh-pages already contains ${package_file} and an index entry for ${CHART_VERSION}."
          else
            echo "ok=false" >> "${GITHUB_OUTPUT}"
            echo "gh-pages is missing ${package_file} or its index entry; continuing."
          fi

      - name: Checkout upstream chart
        if: steps.release.outputs.exists != 'true' || steps.gh_pages.outputs.ok != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ steps.upstream.outputs.tag }}
          path: upstream
          sparse-checkout: ${{ env.CHART_PATH }}
          sparse-checkout-cone-mode: false

      - name: Set up Helm
        if: steps.release.outputs.exists != 'true' || steps.gh_pages.outputs.ok != 'true'
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        if: steps.release.outputs.exists != 'true' || steps.gh_pages.outputs.ok != 'true'
        id: package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          helm lint "upstream/${CHART_PATH}"
          helm package "upstream/${CHART_PATH}" \
            --destination dist \
            --version "${{ steps.upstream.outputs.chart_version }}" \
            --app-version "${{ steps.upstream.outputs.chart_version }}"

          package_path="$(find dist -maxdepth 1 -name '*.tgz' -type f | head -n 1)"
          if [[ -z "${package_path}" ]]; then
            echo "No chart package was created." >&2
            exit 1
          fi

          echo "path=${package_path}" >> "${GITHUB_OUTPUT}"
          echo "file=$(basename "${package_path}")" >> "${GITHUB_OUTPUT}"

      - name: Publish Helm repository to gh-pages
        if: steps.gh_pages.outputs.ok != 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          repo_name="${GITHUB_REPOSITORY#*/}"
          chart_repo_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}"

          cp "${PACKAGE_PATH}" gh-pages/

          if [[ -f gh-pages/index.yaml ]]; then
            helm repo index gh-pages --url "${chart_repo_url}" --merge gh-pages/index.yaml
          else
            helm repo index gh-pages --url "${chart_repo_url}"
          fi

          cat > gh-pages/README.md <<EOF
          # code-server Helm chart

          This branch is managed by GitHub Actions.

          \`\`\`sh
          helm repo add code-server ${chart_repo_url}
          helm repo update
          \`\`\`
          EOF

          git -C gh-pages add README.md index.yaml "$(basename "${PACKAGE_PATH}")"
          if git -C gh-pages diff --cached --quiet; then
            echo "No gh-pages changes to publish."
          else
            git -C gh-pages commit -m "Publish code-server chart ${TAG}"
            git -C gh-pages push origin HEAD:gh-pages
          fi

      - name: Create GitHub release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "${TAG}" "${PACKAGE_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --notes "Helm chart packaged from ${UPSTREAM_REPOSITORY}@${TAG}."
